name: QA GameSocial
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gamesocial-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_APP_MODE: demo
          GITHUB_PAGES: 'true'
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Capturar telas completas e diagnosticar JS/layout
        id: visual
        shell: bash
        run: |
          set +e
          npm run test:visual
          status=$?
          npm run report:visual
          report_status=$?
          if [ -f visual-audit/summary.md ]; then
            cat visual-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$report_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamesocial-auditoria-visual
          path: |
            visual-audit/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix server test
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'